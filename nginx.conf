# Límites de peticiones por dirección IP (este archivo se incluye dentro del bloque http de nginx).
#   auth: registro, inicio de sesión y recuperación. Cada intento cuesta CPU al backend (BCrypt), así que
#         sin límite un solo equipo podría saturarlo o probar contraseñas sin freno.
#   api:  el resto de la API, contra ráfagas automáticas.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # En producción hay un proxy delante (Caddy, que pone el HTTPS). Se toma de él la IP real del cliente
    # para que los límites sean por persona y no uno solo para todos. Solo se confía en las redes
    # privadas de Docker: una petición que llega directo desde internet no puede falsear su IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Fotos de hasta 5 MB (el backend admite 6 MB por petición); el valor por defecto de nginx es 1 MB y daría 413
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (se aplican a todas las respuestas)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Solo se ejecuta código servido por la propia aplicación; las fotos pueden venir de S3 (https).
    # style-src admite estilos en línea porque Angular los inserta así para cada componente.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Autenticación: límite más estricto. Se toleran ráfagas cortas (varias pestañas, pruebas E2E en paralelo),
    # pero el ritmo sostenido queda en 10 por segundo por IP.
    location ^~ /api/auth/ {
        limit_req zone=auth burst=60 nodelay;
        include /etc/nginx/conf.d/proxy-backend.inc;
    }

    # API: se reenvía al backend por la red interna de Docker. Como la app y la API
    # comparten dirección, el navegador no necesita CORS.
    location ^~ /api/ {
        limit_req zone=api burst=100 nodelay;
        include /etc/nginx/conf.d/proxy-backend.inc;
    }

    # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): cache de un año
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que los usuarios reciban siempre la versión nueva
    location = /index.html {
        expires -1;
    }

    # Rutas de Angular (/login, /catalogo, ...): se devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
