server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (se aplican a todas las respuestas)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: se reenvía al backend por la red interna de Docker. Como la app y la API
    # comparten dirección, el navegador no necesita CORS.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno de Docker
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): cache de un año
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que los usuarios reciban siempre la versión nueva
    location = /index.html {
        expires -1;
    }

    # Rutas de Angular (/login, /catalogo, ...): se devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
