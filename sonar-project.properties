# Análisis del frontend en SonarQube (http://localhost:9000)
# El token NO va aquí: se pasa con la variable de entorno SONAR_TOKEN.
sonar.projectKey=PetAdopt-Frontend
sonar.projectName=PetAdopt Frontend
sonar.sourceEncoding=UTF-8

# Código fuente y pruebas
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts,src/testing/**
sonar.test.inclusions=**/*.spec.ts

# Cobertura generada por "npm run test:ci" (Vitest + v8)
sonar.javascript.lcov.reportPaths=coverage/fronet-petadot/lcov.info
sonar.coverage.exclusions=src/main.ts,src/environments/**,src/app/app.config.ts,src/app/app.routes.ts,**/*.html,**/*.scss
